<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../ui-library/dist/assets/css/tokens.css">
  <link rel="stylesheet" href="../../../ui-library/dist/s1-ui.css">
  <style>
    .form-group { display: flex; flex-direction: column; gap: var(--spacing-8); }
    .form-actions { display: flex; gap: var(--spacing-12); margin-top: var(--spacing-24); }
    .form-label { font-size: var(--font-size-14); color: var(--color-text-body-primary); }
  </style>
</head>
<body>
  <div class="form-group">
    <span class="form-label" id="name-label">이름</span>
    <div data-s1-component="input" data-size="md" data-break="pc" aria-labelledby="name-label">
      <div data-s1-part="field">
        <input data-s1-part="control" type="text">
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button type="button" data-s1-component="button" data-variant="primary" data-size="md">
      <span data-s1-part="label">저장</span>
    </button>
    <button type="button" data-s1-component="button" data-variant="secondary" data-size="md">
      <span data-s1-part="label">취소</span>
    </button>
  </div>
  <script type="module">
    import { autoInit } from "../../../ui-library/dist/s1-ui.auto.js";
    autoInit();
  </script>
</body>
</html>
