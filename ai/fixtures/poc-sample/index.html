<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 표본 POC — S1 을 입히기 전, 개발자가 먼저 만들어 둔 화면. 고치지 마세요(입히기 연습용 원본). -->
  <title>출입 기록 관리</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px 32px; color: #222; }
    .breadcrumb { font-size: 13px; color: #888; }
    .page-head { display: flex; justify-content: space-between; align-items: center; }
    .btn { border: 0; border-radius: 4px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #3b6ff5; color: #fff; } .btn-dark { background: #222; color: #fff; }
    .btn-danger { background: #e5484d; color: #fff; } .btn-sm { padding: 4px 10px; font-size: 12px; }
    .search-bar { display: flex; gap: 8px; margin: 16px 0; padding: 12px; background: #f4f5f7; border-radius: 6px; }
    .form-control, .form-select { border: 1px solid #ccc; border-radius: 4px; padding: 7px 10px; font-size: 14px; }
    .grid { width: 100%; border-collapse: collapse; } .grid th, .grid td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
    .badge { border-radius: 10px; padding: 2px 8px; font-size: 12px; color: #fff; } .badge-green { background: #2fa36b; } .badge-red { background: #e5484d; }
    .progress { margin-top: 16px; background: #eee; border-radius: 4px; overflow: hidden; } .progress-bar { width: 62%; background: #3b6ff5; color: #fff; font-size: 12px; padding: 2px 8px; }
    .switch { display: inline-flex; gap: 6px; margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <nav class="breadcrumb">홈 &gt; 출입 관리 &gt; 출입 기록</nav>
  <div class="page-head">
    <h1>출입 기록 관리</h1>
    <button class="btn btn-primary" id="btnNew">등록</button>
  </div>
  <form class="search-bar">
    <input class="form-control" type="text" placeholder="이름·카드번호">
    <input class="form-control" type="date">
    <select class="form-select"><option>전체 상태</option><option>정상</option><option>거부</option></select>
    <button class="btn btn-dark" type="submit">검색</button>
  </form>
  <table class="grid">
    <thead><tr><th>이름</th><th>출입문</th><th>상태</th><th></th></tr></thead>
    <tbody>
      <tr><td>김가나</td><td>본관 1층</td><td><span class="badge badge-green">정상</span></td><td><button class="btn btn-danger btn-sm">삭제</button></td></tr>
      <tr><td>이다라</td><td>별관 B1</td><td><span class="badge badge-red">거부</span></td><td><button class="btn btn-danger btn-sm">삭제</button></td></tr>
    </tbody>
  </table>
  <div class="progress"><div class="progress-bar" style="width:62%">동기화 62%</div></div>
  <label class="switch"><input type="checkbox"> 실시간 갱신</label>
</body>
</html>
