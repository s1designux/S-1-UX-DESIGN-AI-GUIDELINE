<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 표본 — 이미 있던 안내 문서에 S1 토큰으로 색·글자·간격만 입힌 모습. 부품은 갈아 끼우지 않았다. -->
  <title>출입 카드 발급 안내</title>
  <link rel="stylesheet" href="../../../ui-library/dist/assets/css/tokens.css">
  <style>
    body { margin: 0; padding: var(--spacing-32); color: var(--color-text-body-primary); background: var(--color-bg-level-0); }
    h1 { font-size: var(--font-size-24); color: var(--color-text-title-primary); margin: 0 0 var(--spacing-24); }
    p { font-size: var(--font-size-14); margin: 0 0 var(--spacing-8); }
    table { border-collapse: collapse; margin-top: var(--spacing-24); }
    td, th { padding: var(--spacing-8) var(--spacing-12); border-bottom: var(--border-width-default) solid var(--color-line-default); }
    .more { color: var(--color-text-state-accent); }
  </style>
</head>
<body data-s1-density="wide">
  <h1>출입 카드 발급 안내</h1>
  <p>출입 카드는 입사 첫날 안내 데스크에서 받습니다.</p>
  <table>
    <tr><th>구분</th><th>발급 장소</th></tr>
    <tr><td>임직원</td><td>본관 1층 안내 데스크</td></tr>
  </table>
  <button type="button" class="more">자세히 보기</button>
</body>
</html>
