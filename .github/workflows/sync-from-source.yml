name: Sync from S-1 Design System

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pull the latest AI guideline files
        run: node scripts/sync-from-source.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify PC behavior contracts
        run: npm test
      - name: Rebuild the AI checker's answer sheet
        run: npm run ai:scope
      - name: Self-check the checker
        run: npm run ai:selftest
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 새로 생긴 파일도 변경으로 센다 — git diff 만으로는 새 파일을 못 본다.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          SYNCED_AT=$(node -p "require('./SOURCE.json').syncedAt")
          git commit -m "chore: 디자인 가이드 갱신 — ${SYNCED_AT}" -m "무엇이 바뀌었는지는 CHANGELOG.md 맨 위 항목 참조."
          git push
